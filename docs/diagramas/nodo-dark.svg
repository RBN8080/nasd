<rect x="50" y="240" width="800" height="46" rx="8" fill="#0d1117" stroke="#ff7b72" stroke-width="1"/>
<text x="68" y="262" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0">nftables</text>
<text x="140" y="262" fill="#9198a1" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0">default DENY. Each open port is justified in a decision record.</text>
