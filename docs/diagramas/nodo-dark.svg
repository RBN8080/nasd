<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-label="Services running on the node: three ways in, one firewall, three listeners, six scheduled units and one disk">
<title>nasd — what runs on the node</title>
